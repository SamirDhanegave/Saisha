<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Influencer</title> 
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: #000000;
            color: #0aec28;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            color: #00ff88;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            background: radial-gradient(circle at 50% 50%, #003300, #000000 70%);
            overflow: hidden;
            padding: 0 5%;
        }

        .hero .content {
            z-index: 2;
            max-width: 50%;
        }

        .hero h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00ff88, #00c3ff);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            animation: glow 2s infinite alternate;
        }

        .hero p {
            font-size: 1.2rem;
            margin-top: 20px;
            max-width: 600px;
            text-align: left;
            opacity: 0.9;
        }

        .hero .btn {
            display: inline-block;
            margin: 20px 10px 0 0;
            padding: 12px 30px;
            font-size: 1rem;
            color: #000;
            background: #00ff88;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        .hero .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px #00ff88;
        }

        /* Influencer Image Section */
        .hero .image-container {
            z-index: 2;
            position: relative;
            max-width: 35%;
        }

        .hero .image-container img {
            width: 100%;
            border-radius: 15px;
            animation: float 6s infinite ease-in-out;
            box-shadow: 0 20px 50px rgba(0, 255, 136, 0.5);
        }
        .content,h1{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        /* Background Animations */
        .background-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .background-elements .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(90deg, #00ff88, transparent);
            animation: float 3s infinite ease-in-out;
            opacity: 0.8;
        }

        .background-elements .circle:nth-child(1) {
            width: 150px;
            height: 150px;
            top: 20%;
            left: 10%;
        }

        .background-elements .circle:nth-child(2) {
            width: 200px;
            height: 200px;
            top: 60%;
            left: 30%;
        }

        .background-elements .circle:nth-child(3) {
            width: 100px;
            height: 100px;
            top: 40%;
            right: 15%;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 5px #00ff88, 0 0 10px #00c3ff;
            }
            100% {
                text-shadow: 0 0 20px #00ff88, 0 0 40px #00c3ff;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero {
                flex-direction: column;
                text-align: center;
            }

            .hero .content {
                max-width: 100%;
                margin-bottom: 20px;
            }

            .hero .image-container {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 0.9rem;
            }
        }



  .btn {
    font-size: 0.9rem;
    padding: 8px 15px;
  }

    </style>
</head>
<body>
    <div class="hero">
        <div class="background-elements">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
        <div class="content">
           <h1>MEET SAISHA</h1>
            <p style="font-family: cursive;">Your AI-powered guide to the future. Explore endless possibilities and ignite your imagination.</p>

            <a href="about.html" class="btn">About Saisha</a> 
            <a href="blog.html" class="btn">Blogs By Saisha</a>
            <br>                   
                 
            <!-- <a href="chatbot.html" class="btn">Chat With Saisha</a> -->
            <a href="gallery.html" class="btn">Gallery of Saisha</a>

        </div>
        <div class="image-container">
            <img src="saisha.png" alt="AI Influencer Saisha">
        </div>
    </div>

   
</body>
</html>

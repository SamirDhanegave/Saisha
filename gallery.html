<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saisha's Image Gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <div class="gallery-container">
        <h1 class="gallery-title">Saisha's Digital Gallery</h1>
        <div class="gallery-grid">


            <!-- Individual Image Card -->
            <div class="gallery-card">
                <img src="saisha craft.jpeg"Saisha in a creative pose" class="gallery-image">
                <div class="image-overlay">
                    <h2>Creative Vision</h2>
                    <p>"Embracing AI's potential to craft beauty."</p>
                </div>
            </div>
<br>
            <div class="gallery-card">
                <img src="saisha tech.jpeg" alt="Saisha with a tech background" class="gallery-image">
                <div class="image-overlay">
                    <h2>Tech Harmony</h2>
                    <p>"Fusing innovation with humanity's essence."</p>
                </div>
            </div>
<br>
            <div class="gallery-card">
                <img src="neon saisha.jpeg" alt="Saisha with a tech background" class="gallery-image">
                <div class="image-overlay">
                    <h2>Neon Dreams</h2>
                    <p>"Where technology meets creativity."</p>
                </div>
            </div>
<br>
            <div class="gallery-card">
                <img src="indian.jpeg" alt="Saisha in an abstract theme" class="gallery-image">
                <div class="image-overlay">
                    <h2>Indian Outfit</h2>
                    <p>"Exploring the beauty of Indian culture"</p>
                </div>
           
            </div>
            
            <!-- Add more cards as needed -->
        </div>
    </div>
    <script src="gallery.js"></script>
</body>
</html>
